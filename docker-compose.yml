version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:latest
    container_name: notification-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - notification-net

  mongodb:
    image: mongo:6.0
    container_name: notification-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    volumes:
      - mongodb_data:/data/db
    networks:
      - notification-net

  mongo-express:
    image: mongo-express
    container_name: notification-mongo-express
    restart: always
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: secretpassword
      ME_CONFIG_MONGODB_URL: mongodb://root:secretpassword@mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - notification-net

  postgres:
    image: postgres
    container_name: notification-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - notification-net

  user-app:
    build: ./user
    image: user-app
    container_name: user-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
    ports:
      - "8080:8080"
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - notification-net

  notifications-app:
    build: ./notifications
    image: notifications-app
    container_name: notifications-app
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:secretpassword@mongodb:27017/notifications?authSource=admin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
    ports:
      - "8081:8081"
    depends_on:
      - rabbitmq
      - mongodb
    networks:
      - notification-net

volumes:
  mongodb_data:
  postgres_data:

networks:
  notification-net:
    driver: bridge
